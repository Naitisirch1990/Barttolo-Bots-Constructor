name: Build Asistente y Ayudante

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build both Forge 1.20.1 mods
        run: chmod +x gradlew && ./gradlew build -x test
      - name: Verify independent constructor and gardener in Minecraft
        timeout-minutes: 8
        run: ./gradlew :ayudante:runGameTestServer
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Barttolo-Asistente-y-Ayudante-Forge-1.20.1
          path: |
            build/libs/*.jar
            ayudante/build/libs/*.jar
          if-no-files-found: error
